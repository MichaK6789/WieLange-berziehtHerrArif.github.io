<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Class Vote</title>
  <style>
    .nav { position: fixed; top: 10px; right: 15px; }
    .nav a { margin-left: 12px; }
    #winner { font-weight: bold; }
  </style>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
  <div class="nav"><a href="admin.html">Admin</a></div>
  <h1>Class Vote</h1>

  <input id="name" placeholder="Your name" maxlength="40">
  <input id="secs" type="number" min="0" placeholder="Guess (seconds)">
  <button id="send">Submit</button>
  <p id="msg"></p>

  <h2 id="winnerTitle" hidden>Winner</h2>
  <p id="winner"></p>

  <h2>Results</h2>
  <p id="stats"></p>
  <ul id="results"></ul>

  <script>
    const db = supabase.createClient("https://yxmfpoaujakkixqydgna.supabase.co", "sb_publishable_l8UspBwusWxFnWo1WbbIWg_ddXL312G");
    const TABLE = "guesses";

    document.getElementById("send").onclick = async () => {
      const voter_name = document.getElementById("name").value.trim();
      const guess_seconds = parseInt(document.getElementById("secs").value, 10);
      const msg = document.getElementById("msg");

      if (!voter_name || isNaN(guess_seconds)) {
        msg.textContent = "Please enter a name and a number.";
        return;
      }
      if (localStorage.getItem("voted")) {
        msg.textContent = "You already voted on this device.";
        return;
      }
      const { error } = await db.from(TABLE).insert({ voter_name, guess_seconds });
      if (error) { msg.textContent = "Error: " + error.message; return; }
      localStorage.setItem("voted", "1");
      msg.textContent = "Thanks for voting!";
      loadResults();
    };

    async function loadResults() {
      const msg = document.getElementById("msg");
      const [g, r] = await Promise.all([
        db.from(TABLE).select("voter_name, guess_seconds").order("guess_seconds"),
        db.from("game_result").select("actual_seconds").maybeSingle()
      ]);
      if (g.error) { msg.textContent = "Load error: " + g.error.message; return; }
      const data = g.data;
      const actual = r.data ? r.data.actual_seconds : null;

      const list = document.getElementById("results");
      list.innerHTML = "";
      data.forEach(x => {
        const li = document.createElement("li");
        li.textContent = `${x.voter_name}: ${x.guess_seconds} s`;
        list.appendChild(li);
      });
      const avg = data.length ? Math.round(data.reduce((s, x) => s + x.guess_seconds, 0) / data.length) : 0;
      document.getElementById("stats").textContent = `${data.length} guesses, average ${avg} s`;

      const title = document.getElementById("winnerTitle");
      const winner = document.getElementById("winner");
      if (actual === null || !data.length) {
        title.hidden = true;
        winner.textContent = "";
        return;
      }
      const best = Math.min(...data.map(x => Math.abs(x.guess_seconds - actual)));
      const winners = data.filter(x => Math.abs(x.guess_seconds - actual) === best);
      title.hidden = false;
      winner.textContent =
        `Real time: ${actual} s. ` +
        (winners.length > 1 ? "Winners (tie): " : "Winner: ") +
        winners.map(x => `${x.voter_name} (${x.guess_seconds} s, off by ${best} s)`).join(", ");
    }

    loadResults();
    setInterval(loadResults, 5000);
  </script>
</body>
</html>
