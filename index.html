<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Class Vote</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
  <h1>Class Vote</h1>
  <div id="buttons"></div>
  <p id="msg"></p>
  <h2>Results</h2>
  <ul id="results"></ul>

  <script>
    const db = supabase.createClient("https://yxmfpoaujakkixqydgna.supabase.co", "sb_publishable_l8UspBwusWxFnWo1WbbIWg_ddXL312G");
    const options = ["Option A", "Option B", "Option C"];

    const buttons = document.getElementById("buttons");
    options.forEach(o => {
      const b = document.createElement("button");
      b.textContent = o;
      b.onclick = () => vote(o);
      buttons.appendChild(b);
    });

    async function vote(choice) {
      if (localStorage.getItem("voted")) {
        msg.textContent = "You already voted on this device.";
        return;
      }
      const { error } = await db.from("votes").insert({ choice });
      if (error) { msg.textContent = "Error: " + error.message; return; }
      localStorage.setItem("voted", "1");
      msg.textContent = "Thanks for voting!";
      loadResults();
    }

    async function loadResults() {
      const { data, error } = await db.rpc("get_results");
      if (error) return;
      results.innerHTML = "";
      data.forEach(r => {
        const li = document.createElement("li");
        li.textContent = `${r.choice}: ${r.total}`;
        results.appendChild(li);
      });
    }

    loadResults();
    setInterval(loadResults, 5000); // refresh every 5 seconds
  </script>
</body>
</html>
