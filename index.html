<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Wie lange überzieht Herr Arif?</title>
  <style>
    :root {
      --bg1: #eef2ff;
      --bg2: #f8fafc;
      --card: #ffffff;
      --text: #0f172a;
      --muted: #64748b;
      --border: #e2e8f0;
      --accent: #4f46e5;
      --accent-hover: #4338ca;
      --accent-soft: #eef2ff;
      --gold: #f59e0b;
      --shadow: 0 10px 30px rgba(15, 23, 42, 0.08);
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg1: #0f172a;
        --bg2: #020617;
        --card: #1e293b;
        --text: #f1f5f9;
        --muted: #94a3b8;
        --border: #334155;
        --accent: #818cf8;
        --accent-hover: #6366f1;
        --accent-soft: #312e81;
        --shadow: 0 10px 30px rgba(0, 0, 0, 0.4);
      }
    }

    * { box-sizing: border-box; }

    html { scroll-behavior: smooth; }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Inter, Helvetica, Arial, sans-serif;
      color: var(--text);
      background: linear-gradient(160deg, var(--bg1), var(--bg2)) fixed;
      line-height: 1.5;
    }

    header {
      position: sticky;
      top: 0;
      z-index: 10;
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      align-items: center;
      padding: 14px 20px;
      background: color-mix(in srgb, var(--card) 85%, transparent);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      border-bottom: 1px solid var(--border);
    }
    header h1 {
      grid-column: 2;
      margin: 0;
      font-size: clamp(1.1rem, 3.5vw, 1.6rem);
      font-weight: 800;
      letter-spacing: -0.02em;
      text-align: center;
    }
    .nav { grid-column: 3; justify-self: end; }
    .nav a {
      color: var(--accent);
      text-decoration: none;
      font-weight: 600;
      padding: 6px 12px;
      border-radius: 999px;
      transition: background 0.15s;
    }
    .nav a:hover { background: var(--accent-soft); }

    main {
      max-width: 720px;
      margin: 0 auto;
      padding: 28px 16px 60px;
    }

    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 18px;
      box-shadow: var(--shadow);
      padding: 22px;
      margin-bottom: 22px;
    }
    .card h2 {
      margin: 0 0 14px;
      font-size: 1.15rem;
      letter-spacing: -0.01em;
    }

    .form { display: flex; flex-wrap: wrap; gap: 10px; }
    input {
      flex: 1 1 160px;
      padding: 12px 14px;
      font-size: 1rem;
      color: var(--text);
      background: var(--bg2);
      border: 1px solid var(--border);
      border-radius: 12px;
      outline: none;
      transition: border-color 0.15s, box-shadow 0.15s;
    }
    input:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 25%, transparent);
    }
    button {
      flex: 1 1 100%;
      padding: 12px 18px;
      font-size: 1rem;
      font-weight: 700;
      color: #fff;
      background: var(--accent);
      border: none;
      border-radius: 12px;
      cursor: pointer;
      transition: background 0.15s, transform 0.05s;
    }
    button:hover { background: var(--accent-hover); }
    button:active { transform: scale(0.98); }

    #msg { margin: 12px 0 0; min-height: 1.4em; color: var(--muted); }

    #winnerCard {
      border: 2px solid var(--gold);
      background: color-mix(in srgb, var(--gold) 10%, var(--card));
    }
    #winner { margin: 0; font-weight: 700; font-size: 1.05rem; }

    #stats { margin: 0 0 12px; color: var(--muted); }

    ul, ol { list-style: none; margin: 0; padding: 0; }
    .list { max-height: 360px; overflow-y: auto; }
    .list li {
      padding: 10px 12px;
      border-radius: 10px;
      border-bottom: 1px solid var(--border);
    }
    .list li:last-child { border-bottom: none; }
    .list li:nth-child(odd) { background: var(--bg2); }
    .empty { color: var(--muted); font-style: italic; }
    .small { display: block; color: var(--muted); font-size: 0.85rem; }

    @media (max-width: 520px) {
      header { grid-template-columns: 1fr; gap: 6px; text-align: center; }
      header h1, .nav { grid-column: 1; justify-self: center; }
      .card { padding: 18px; }
    }
  </style>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
  <header>
    <h1>Wie lange überzieht Herr Arif?</h1>
    <div class="nav"><a href="admin.html">Admin</a></div>
  </header>

  <main>
    <section class="card">
      <h2>Dein Tipp</h2>
      <div class="form">
        <input id="name" placeholder="Dein Name" maxlength="40" autocomplete="off">
        <input id="secs" type="number" min="0" placeholder="Tipp (Sekunden)">
        <button id="send">Abschicken</button>
      </div>
      <p id="msg"></p>
    </section>

    <section class="card" id="winnerCard" hidden>
      <h2>🏆 Gewinner</h2>
      <p id="winner"></p>
    </section>

    <section class="card">
      <h2>Ergebnisse</h2>
      <p id="stats"></p>
      <ul id="results" class="list"></ul>
    </section>

    <section class="card">
      <h2>Bestenliste</h2>
      <ol id="leaderboard" class="list"></ol>
    </section>
  </main>

  <script>
    const db = supabase.createClient("https://yxmfpoaujakkixqydgna.supabase.co", "sb_publishable_l8UspBwusWxFnWo1WbbIWg_ddXL312G");
    const TABLE = "guesses";

    document.getElementById("send").onclick = async () => {
      const voter_name = document.getElementById("name").value.trim();
      const guess_seconds = parseInt(document.getElementById("secs").value, 10);
      const msg = document.getElementById("msg");

      if (!voter_name || isNaN(guess_seconds)) {
        msg.textContent = "Bitte gib einen Namen und eine Zahl ein.";
        return;
      }
      const { error } = await db.from(TABLE).insert({ voter_name, guess_seconds });
      if (error) {
        msg.textContent = error.message.includes("row-level security")
          ? "Die Abstimmung ist geschlossen (ein Ergebnis wurde festgelegt)."
          : "Fehler: " + error.message;
        return;
      }
      msg.textContent = "Danke fürs Abstimmen!";
      loadResults();
    };

    function addItem(list, text, sub) {
      const li = document.createElement("li");
      li.textContent = text;
      if (sub) {
        const s = document.createElement("span");
        s.className = "small";
        s.textContent = sub;
        li.appendChild(s);
      }
      list.appendChild(li);
    }

    function addEmpty(list, text) {
      const li = document.createElement("li");
      li.className = "empty";
      li.textContent = text;
      list.appendChild(li);
    }

    async function loadResults() {
      const msg = document.getElementById("msg");
      const [g, r] = await Promise.all([
        db.from(TABLE).select("voter_name, guess_seconds").order("guess_seconds"),
        db.from("game_result").select("actual_seconds").maybeSingle()
      ]);
      if (g.error) { msg.textContent = "Ladefehler: " + g.error.message; return; }
      const data = g.data;
      const actual = r.data ? r.data.actual_seconds : null;

      const list = document.getElementById("results");
      list.innerHTML = "";
      if (!data.length) addEmpty(list, "Noch keine Tipps.");
      data.forEach(x => addItem(list, `${x.voter_name}: ${x.guess_seconds} s`));

      const avg = data.length ? Math.round(data.reduce((s, x) => s + x.guess_seconds, 0) / data.length) : 0;
      document.getElementById("stats").textContent = `${data.length} Tipps, Durchschnitt ${avg} s`;

      const card = document.getElementById("winnerCard");
      const winner = document.getElementById("winner");
      if (actual === null || !data.length) {
        card.hidden = true;
        winner.textContent = "";
        return;
      }
      const best = Math.min(...data.map(x => Math.abs(x.guess_seconds - actual)));
      const winners = data.filter(x => Math.abs(x.guess_seconds - actual) === best);
      card.hidden = false;
      winner.textContent =
        `Echte Zeit: ${actual} s. ` +
        (winners.length > 1 ? "Gewinner (Gleichstand): " : "Gewinner: ") +
        winners.map(x => `${x.voter_name} (${x.guess_seconds} s, ${best} s daneben)`).join(", ");
    }

    async function loadLeaderboard() {
      const { data, error } = await db
        .from("leaderboard")
        .select("voter_name, guess_seconds, actual_seconds, diff_seconds, submitted_at")
        .order("declared_at", { ascending: true }); // älteste zuerst; false für neueste zuerst
      if (error) return;
      const list = document.getElementById("leaderboard");
      list.innerHTML = "";
      if (!data.length) addEmpty(list, "Noch keine Gewinner.");
      data.forEach(x => addItem(
        list,
        `${x.voter_name}: Tipp ${x.guess_seconds} s, echte Zeit ${x.actual_seconds} s (${x.diff_seconds} s daneben)`,
        `Abgegeben am ${new Date(x.submitted_at).toLocaleString("de-DE")}`
      ));
    }

    loadResults();
    loadLeaderboard();
    setInterval(() => { loadResults(); loadLeaderboard(); }, 5000);
  </script>
</body>
</html>
